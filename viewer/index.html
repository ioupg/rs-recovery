<style>
  :root {
    --void:   #0A0E14;
    --panel:  #0F151E;
    --panel2: #131B26;
    --line:   #22303E;
    --ink:    #C8D6E0;

    --faint:  #3A4A58;

    --focus:  #4A90D9;

  * { margin:0; padding:0; box-sizing:border-box; }

    background:var(--void); color:var(--ink);

  /* registry rail */

    display:flex; align-items:baseline; gap:8px; width:100%;

  .ship.sel .hull { color:var(--star); }

  /* viewport */

  /* ── title block (ГОСТ-style stamp) ─────────────────── */

  /* compartment ledger */

  .crow { display:flex; align-items:center; gap:7px; padding:2px 8px; }

  }

<script>
/* ════════ data semantics ════════ */
const COMP = {
  0:{n:'энергия',    c:0xE8C34A},
  1:{n:'ЦП',         c:0x8B7BD8},
  2:{n:'обитаемый',  c:0x6BA368},
  3:{n:'гироскоп',   c:0x3FA7A3},
  4:{n:'баки',       c:0x4A90D9},
  5:{n:'орудия',     c:0xD64545},
  6:{n:'двигатели',  c:0xD65A31},
  7:{n:'ангар',      c:0xC77B9E},
  8:{n:'корпус',     c:0x46586B},
  9:{n:'мостик',     c:0xE5E9ED},
};
const HULL_ID = 8;
const WING_COLOR = 0x51636F;
/* plates drop into the open window each hull shell leaves on its face; the
   window is measured from the mesh at decode time. The margin just keeps the
   plate edge off the rim so the two never fight for the same pixels. */
const PLATE_MARGIN = .985;
/* The hull shapes are shells, so without a backing you see straight through the
   window of any face whose plate does not cover it. The filler is the plain
   culled hull pushed a little way inside, which blocks the view without ever
   reaching the surface the detail meshes occupy. */
const FILL_INSET = .045;
/* interior module cage, shrunk to clear the shell it sits inside */
const MODULE_SCALE = .88;

/* faces per shape as corner-index loops (validated vs exe plate tables) */
const FACES = {
  0: [[0,1,5,4],[2,6,7,3],[0,4,6,2],[1,3,7,5],[0,2,3,1],[4,5,7,6]],
  1: [[0,1,5,4],[1,3,7,5],[4,5,7,6],[0,4,6],[6,7,3],[0,3,1],[0,6,3]],
  2: [[0,1,5,4],[4,5,7,6],[0,1,7,6],[0,6,4],[1,5,7]],
  3: [[1,4,5],[1,5,7],[4,5,7],[1,4,7]],
};
const corner = i => [i&1, (i>>1)&1, (i>>2)&1];
/* solid centroid per shape (mean of its corner set): strictly interior for these
   convex solids, so a facet normal is outward iff it points away from it */
const SHAPE_CENTROID = Object.fromEntries(Object.keys(FACES).map(s => {
  const ids = [...new Set(FACES[s].flat())];
  const m = ids.reduce((a,i)=>{const c=corner(i); return [a[0]+c[0],a[1]+c[1],a[2]+c[2]];},[0,0,0]);
  return [s, m.map(x=>x/ids.length)];
}));

/* ── chamfer: inset every exterior facet, then close the gaps with bevel strips
      along shared edges and fan patches at corners. Interior edges never appear
      here because coincident facets were already culled. ── */
const V3 = {
  sub: (a,b)=>[a[0]-b[0], a[1]-b[1], a[2]-b[2]],
  add: (a,b)=>[a[0]+b[0], a[1]+b[1], a[2]+b[2]],
  mul: (a,s)=>[a[0]*s, a[1]*s, a[2]*s],
  cross: (a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  dot: (a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  len: a=>Math.hypot(a[0],a[1],a[2]),
};
const vkey = v => v.map(x=>Math.round(x*1000)).join(',');

/* ── ambient occlusion, baked per vertex from cell occupancy ──
   For a vertex, look at the eight grid cells touching it and keep the ones on the
   outward side of the facet: those are what a hemisphere of skylight would have to
   pass through. The fraction that are solid is the occlusion. Partial shapes
   (wedges, tetras) count for less than a full cube since they leave the cell open.
   Vertex colours interpolate across each facet, so this reads as a soft gradient
   even though the shading itself is flat. */
const SHAPE_FILL = {0:1, 1:.8, 2:.55, 3:.3};
/* AO_POWER tightens the falloff the way raising a specular exponent does: high
   values keep open surfaces clean and drive the darkening deep into the crevices,
   so AO_DEPTH can be pushed hard without greying out the whole hull.
   AO_RANGE is where the raw occlusion ratio saturates — a cosine-weighted sample of
   this neighbourhood tops out near 0.7 in the deepest corners (measured across the
   fleet), and normalising by it puts the whole curve to work instead of its toe. */
const AO_POWER = 1.8, AO_DEPTH = .86, AO_RANGE = .42;
function occupancyOf(cubes) {
  const occ = new Map();
  for (const c of cubes)
    occ.set(`${c.x},${c.y},${c.z}`, Math.max(occ.get(`${c.x},${c.y},${c.z}`)||0,
                                             SHAPE_FILL[c.shape] ?? 1));
  return occ;
}
function vertexAO(v, n, occ, ownKey) {
  const cx = Math.round(v[0]), cy = Math.round(v[1]), cz = Math.round(v[2]);
  let solid = 0, total = 0;
  /* Cosine-weighted obscurance over a 4x4x4 neighbourhood. A single ring of eight
     cells is too coarse for slanted facets — a 45-degree plane admits only two of
     them, so the result quantises into blotches. Sampling wider and weighting by
     cos(theta)/d^2 resolves the hemisphere smoothly at any orientation. */
  for (let i=-2; i<2; i++) for (let j=-2; j<2; j++) for (let k=-2; k<2; k++) {
    const dx = i+.5, dy = j+.5, dz = k+.5;          // cell centre relative to vertex
    const d2 = dx*dx + dy*dy + dz*dz, d = Math.sqrt(d2);
    const cos = (dx*n[0] + dy*n[1] + dz*n[2]) / d;
    if (cos <= 0) continue;                          // behind the facet
    const key = `${cx+i},${cy+j},${cz+k}`;
    if (key === ownKey) continue;                    // a wedge must not occlude its own slope
    const w = cos / d2;
    total += w;
    solid += w * (occ.get(key) || 0);
  }
  if (!total) return 1;
  return 1 - AO_DEPTH * Math.pow(Math.min(1, solid/total/AO_RANGE), AO_POWER);
}

/* Point a facet normal outward. Winding is not reliably outward (the k6 slope
   loop winds inward), and the old occupancy probe ties on slanted facets — a
   slope runs through the middle of its own cell, so a quarter-step to either
   side of its centre floors into the same cell and no flip happens. Faces
   therefore carry the centroid of their source solid: outward is away from it.
   Chamfer strips inherit a centroid from their parents; anything without one
   falls back to the probe. */
function orient(n, cen, f, occ) {
  if (f.sc)
    return (n[0]*(cen[0]-f.sc[0]) + n[1]*(cen[1]-f.sc[1]) + n[2]*(cen[2]-f.sc[2])) < 0
      ? [-n[0],-n[1],-n[2]] : n;
  const at = s => occ.get(`${Math.floor(cen[0]+s*.25*n[0])},${Math.floor(cen[1]+s*.25*n[1])},${Math.floor(cen[2]+s*.25*n[2])}`) || 0;
  return at(+1) > at(-1) ? [-n[0],-n[1],-n[2]] : n;
}

function chamferFaces(kept, b) {
  const {sub, add, mul, cross, dot, len} = V3;
  /* 1 — inset each facet within its own plane */
  const F = kept.map(f => {
    const n = f.verts.length;
    const c = mul(f.verts.reduce((s,v)=>add(s,v), [0,0,0]), 1/n);
    let dmin = Infinity;
    for (let i=0; i<n; i++) {
      const a = f.verts[i], e = sub(f.verts[(i+1)%n], a);
      dmin = Math.min(dmin, len(cross(e, sub(c,a))) / (len(e)||1));
    }
    const t = Math.min(b/dmin, .4);
    return {verts:f.verts, comp:f.comp, k:f.k, sc:f.sc, iv:f.verts.map(v=>add(v, mul(sub(c,v), t)))};
  });

  /* 2 — index edges and vertex incidences */
  const E = new Map(), VI = new Map();
  F.forEach((f, fi) => {
    const n = f.verts.length;
    for (let i=0; i<n; i++) {
      const j = (i+1)%n;
      const ek = [vkey(f.verts[i]), vkey(f.verts[j])].sort().join('|');
      (E.get(ek) || E.set(ek, []).get(ek)).push({fi, i, j});
      (VI.get(vkey(f.verts[i])) || VI.set(vkey(f.verts[i]), []).get(vkey(f.verts[i])))
        .push({fi, li:i});
    }
  });

  const out = F.map(f => ({verts:f.iv, comp:f.comp, k:f.k, sc:f.sc}));

  /* 3 — bevel strip per manifold edge; elsewhere (open or non-manifold edges,
        where a wedge slope abuts a cube plate) drop a flap back to the original
        edge so the inset never tears a hole in the hull */
  for (const [, uses] of E) {
    if (uses.length === 2) {
      const [A, B] = uses, fa = F[A.fi], fb = F[B.fi];
      const at = k => fb.verts.findIndex(v => vkey(v) === k);
      const bi = at(vkey(fa.verts[A.i])), bj = at(vkey(fa.verts[A.j]));
      if (bi >= 0 && bj >= 0) {
        out.push({verts:[fa.iv[A.i], fa.iv[A.j], fb.iv[bj], fb.iv[bi]],
                  comp:fa.comp, k:'b'+fa.k+A.i, plain:true,
                  sc: fa.sc && fb.sc &&
                      [(fa.sc[0]+fb.sc[0])/2, (fa.sc[1]+fb.sc[1])/2, (fa.sc[2]+fb.sc[2])/2]});
        continue;
      }
    }
    for (const U of uses) {
      const f = F[U.fi];
      out.push({verts:[f.iv[U.i], f.iv[U.j], f.verts[U.j], f.verts[U.i]],
                comp:f.comp, k:'f'+f.k+U.i, plain:true, sc:f.sc});
    }
  }

  /* 4 — corner patch per vertex: walk the facet ring through shared edges */
  for (const [vkStr, inc] of VI) {
    if (inc.length < 3) continue;
    const seen = new Set();
    const step = (fi, li, dir) => {            // → neighbouring facet across one edge at V
      const f = F[fi], n = f.verts.length;
      const o = dir > 0 ? (li+1)%n : (li-1+n)%n;
      const ek = [vkey(f.verts[li]), vkey(f.verts[o])].sort().join('|');
      const uses = E.get(ek);
      if (!uses || uses.length !== 2) return null;
      const nfi = uses[0].fi === fi ? uses[1].fi : uses[0].fi;
      const nli = F[nfi].verts.findIndex(v => vkey(v) === vkStr);
      return nli < 0 ? null : {fi:nfi, li:nli};
    };
    for (const start of inc) {
      if (seen.has(start.fi)) continue;
      let ring = [start], cur = start, closed = false;
      for (let guard=0; guard<12; guard++) {          // forward
        const nx = step(cur.fi, cur.li, +1);
        if (!nx) break;
        if (nx.fi === start.fi) { closed = true; break; }
        if (ring.some(r=>r.fi===nx.fi)) break;
        ring.push(nx); cur = nx;
      }
      if (!closed) {                                   // open fan → extend backwards
        cur = start;
        for (let guard=0; guard<12; guard++) {
          const pv = step(cur.fi, cur.li, -1);
          if (!pv || ring.some(r=>r.fi===pv.fi)) break;
          ring.unshift(pv); cur = pv;
        }
      }
      ring.forEach(r=>seen.add(r.fi));
      if (ring.length < 3) continue;
      const scs = ring.map(r=>F[r.fi].sc).filter(Boolean);
      out.push({verts: ring.map(r => F[r.fi].iv[r.li]),
                comp: F[ring[0].fi].comp, k:'c'+vkStr, plain:true,
                sc: scs.length === ring.length
                    ? scs.reduce((a,s)=>[a[0]+s[0],a[1]+s[1],a[2]+s[2]],[0,0,0])
                         .map(x=>x/scs.length)
                    : undefined});
    }
  }
  return out;
}
function rot(o, v) {           // R·(v−½)+½  — world-integer result
  const m = ORIENTATIONS[o];
  const x=v[0]-.5, y=v[1]-.5, z=v[2]-.5;
  return [ m[0]*x+m[1]*y+m[2]*z+.5, m[3]*x+m[4]*y+m[5]*z+.5, m[6]*x+m[7]*y+m[8]*z+.5 ];
}

/* ════════ compartment texture atlas ════════
   Abstract surface treatments, not pictograms: each compartment gets a plating
   character (seam rhythm, striation direction, grain) that reads as material at
   ship scale. Grayscale multiplies the compartment tint, so contrast stays low. */
const ATLAS_N = 1024, CELL = 256, COLS = 4, PAD = 16;
function makeAtlas() {
  const cv = document.createElement('canvas'); cv.width = cv.height = ATLAS_N;
  const g = cv.getContext('2d');
  g.fillStyle = '#DEDEDE'; g.fillRect(0,0,ATLAS_N,ATLAS_N);
  /* deterministic PRNG so the atlas is identical every load */
  let seed = 0x2F6E2B1;
  const rnd = () => ((seed = (seed*1103515245 + 12345) & 0x7FFFFFFF) / 0x7FFFFFFF);
  const cell = (i, draw) => {
    const x = (i%COLS)*CELL, y = Math.floor(i/COLS)*CELL;
    g.save(); g.translate(x,y); g.beginPath(); g.rect(0,0,CELL,CELL); g.clip();
    draw(g); g.restore();
  };
  const shade = v => `rgb(${v},${v},${v})`;
  /* fine speckle grain — the base "material" everything sits on */
  const grain = (g, n, amp) => {
    for (let i=0; i<n; i++) {
      const v = 222 + (rnd()-.5)*amp*2;
      g.fillStyle = shade(Math.round(v));
      g.fillRect(rnd()*CELL, rnd()*CELL, 1+rnd()*3, 1+rnd()*3);
    }
  };
  /* parallel striations at an angle: rhythm carries the compartment's character */
  const striate = (g, ang, gap, w, lo, hi, jitter=0) => {
    g.save(); g.translate(CELL/2,CELL/2); g.rotate(ang); g.translate(-CELL,-CELL);
    for (let x=0; x<CELL*2; x+=gap) {
      g.fillStyle = shade(Math.round(lo + rnd()*(hi-lo)));
      g.fillRect(x + (jitter?(rnd()-.5)*jitter:0), 0, w, CELL*2);
    }
    g.restore();
  };
  /* irregular plate seams: splits the face into a few unequal panels */
  const seams = (g, cuts, v) => {
    g.strokeStyle = shade(v); g.lineWidth = 2;
    for (const [a,b,c,d] of cuts) { g.beginPath(); g.moveTo(a,b); g.lineTo(c,d); g.stroke(); }
  };
  const plates = (g, n, lo, hi) => {         // soft tonal patches (worn plating)
    for (let i=0; i<n; i++) {
      g.fillStyle = shade(Math.round(lo + rnd()*(hi-lo)));
      const w = 40+rnd()*90, h = 40+rnd()*90;
      g.fillRect(rnd()*(CELL-w), rnd()*(CELL-h), w, h);
    }
  };
  const specks = (g, n, v, r) => {           // sparse micro-detail
    g.fillStyle = shade(v);
    for (let i=0; i<n; i++) { g.beginPath(); g.arc(rnd()*CELL, rnd()*CELL, r, 0, 7); g.fill(); }
  };

  /* 0 энергия — dense fine ribbing, warm even surface */
  cell(0, g => { plates(g,3,214,228); striate(g,0,7,3,196,212); grain(g,900,10);
    seams(g,[[0,84,256,84],[0,178,256,178]],204); });
  /* 1 ЦП — orthogonal fine grid, tight and regular */
  cell(1, g => { plates(g,2,216,230); striate(g,0,16,2,200,214); striate(g,Math.PI/2,16,2,204,216);
    grain(g,700,8); specks(g,26,196,1.6); });
  /* 2 обитаемый — broad calm panels, minimal texture */
  cell(2, g => { plates(g,5,214,232); grain(g,500,7);
    seams(g,[[0,96,256,88],[128,0,132,256],[132,168,256,172]],206); });
  /* 3 гироскоп — diagonal cross-hatch, machined feel */
  cell(3, g => { plates(g,2,216,228); striate(g,Math.PI/4,14,3,198,212);
    striate(g,-Math.PI/4,14,2,206,218); grain(g,600,8); });
  /* 4 баки — wide smooth bands, pressure-vessel curvature */
  cell(4, g => { plates(g,2,218,230); striate(g,Math.PI/2,42,10,204,216);
    grain(g,400,6); seams(g,[[0,40,256,44],[0,212,256,208]],202); specks(g,14,198,2); });

/* ════════ space environment ════════
   Built procedurally so the page stays self-contained: a faint equirect nebula
   wash on an inverted sphere, plus a real star catalogue-ish point cloud. Star
   brightness follows a steep power law so a handful are much brighter than the
   rest — that, plus bloom, is what sells the depth. */
const SKY_VERT = `
  varying vec3 vDir;
  void main() {
    vDir = position;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }`;

/* Procedural deep-space sky: domain-warped fBm for the nebula, plus four
   cell-hashed star layers. All resolution-independent — no texture to alias. */
const SKY_FRAG = `
  precision highp float;
  varying vec3 vDir;
  uniform float uSeed;

  float hash13(vec3 p) {
    p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419));
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }
  vec3 hash33(vec3 p) {
    return vec3(hash13(p), hash13(p + 19.19), hash13(p + 43.71));
  }
  float vnoise(vec3 x) {
    vec3 i = floor(x), f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    float n000 = hash13(i + vec3(0,0,0)), n100 = hash13(i + vec3(1,0,0));
    float n010 = hash13(i + vec3(0,1,0)), n110 = hash13(i + vec3(1,1,0));
    float n001 = hash13(i + vec3(0,0,1)), n101 = hash13(i + vec3(1,0,1));
    float n011 = hash13(i + vec3(0,1,1)), n111 = hash13(i + vec3(1,1,1));
    return mix(mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),
               mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y), f.z);
  }
  float fbm(vec3 p) {
    float a = 0.5, s = 0.0;
    for (int i = 0; i < 6; i++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; }
    return s;
  }
  /* ridged fBm gives the clouds filaments instead of cotton wool */
  float ridge(vec3 p) {
    float a = 0.5, s = 0.0;
    for (int i = 0; i < 5; i++) {
      s += a * (1.0 - abs(vnoise(p) * 2.0 - 1.0));
      p *= 2.11; a *= 0.5;
    }
    return s;
  }
  /* one star per cell, so cost stays flat no matter how dense it looks.
     Halo size and strength both scale with magnitude, so faint stars stay
     pin-sharp and only the bright ones flare. */
  float starLayer(vec3 dir, float scale, float keep, float core, float glow) {
    vec3 p = dir * scale;
    vec3 i = floor(p), f = fract(p);
    float pick = hash13(i + uSeed);
    if (pick > keep) return 0.0;
    vec3 o = hash33(i + 5.3);
    float d = length(f - o);
    float mag = pow(pick / keep, 3.5);
    float pt = smoothstep(core * (0.45 + 0.55 * mag), 0.0, d) * mag;
    float ha = smoothstep(core * 2.0 * (0.3 + 0.7 * mag), 0.0, d) * mag * mag;
    return pt + glow * ha;
  }

  void main() {
    vec3 dir = normalize(vDir);
    /* galactic band: dense along one great circle, sparse at the poles */
    vec3 axis = normalize(vec3(0.38, 0.86, -0.34));
    float bd = dot(dir, axis);
    float band = exp(-pow(bd * 2.30, 2.0));
    float core = exp(-pow(bd * 5.20, 2.0));

    /* nebula — fBm warped by another fBm, then ridged for filaments */
    vec3 q = dir * 2.15 + uSeed;
    vec3 w = vec3(fbm(q), fbm(q + 3.1), fbm(q + 7.7));
    float n  = fbm(q * 1.60 + w * 2.70);
    float n2 = fbm(q * 3.90 - w * 1.30);
    float fl = ridge(q * 2.60 + w * 1.80);

    float cloud = smoothstep(0.36, 0.74, n) * (0.22 + 0.95 * band);
    cloud += 0.62 * pow(max(fl - 0.55, 0.0) * 2.2, 2.0) * smoothstep(0.40, 0.86, n) * band;

    vec3 deep = vec3(0.045, 0.085, 0.235);
    vec3 rose = vec3(0.265, 0.075, 0.185);
    vec3 teal = vec3(0.020, 0.155, 0.170);
    vec3 neb = mix(deep, rose, smoothstep(0.32, 0.80, n2));
    neb = mix(neb, teal, smoothstep(0.52, 0.94, fbm(q * 0.85 - 4.2)));
    neb *= cloud * 1.75;
    /* hot cores where the filaments pile up */
    neb += vec3(0.95, 0.62, 0.42) * pow(max(cloud - 0.55, 0.0), 2.0) * 0.85;
    /* dust lanes bite back into the band */
    float dust = smoothstep(0.48, 0.84, fbm(q * 3.10 + 11.0)) * band;
    neb *= 1.0 - 0.74 * dust;

    /* unresolved glow, brightest right along the galactic core */
    vec3 col = neb
             + vec3(0.022, 0.030, 0.058) * band * (0.30 + 0.70 * n)
             + vec3(0.075, 0.070, 0.058) * core * (0.35 + 0.65 * n);

    /* star layers: a dense faint dusting up to sparse bright anchors */
    float s0 = starLayer(dir, 470.0, 0.42, 0.040, 0.00);
    float s1 = starLayer(dir, 250.0, 0.34, 0.055, 0.08);
    float s2 = starLayer(dir, 128.0, 0.24, 0.075, 0.16);
    float s3 = starLayer(dir,  61.0, 0.13, 0.100, 0.30);
    float s4 = starLayer(dir,  26.0, 0.05, 0.120, 0.55);
    float dens = 0.45 + 0.85 * band;
    float faint = (s0 * 0.40 + s1 * 0.60 + s2 * 0.90) * dens;
    float bright = s3 * 1.05 + s4 * 1.55;

    /* colour temperature varies per star cell */
    float t = hash13(floor(dir * 61.0) + 91.7);
    vec3 tint = mix(vec3(0.72, 0.83, 1.00), vec3(1.00, 0.78, 0.58),
                    smoothstep(0.58, 1.0, t));
    col += vec3(0.74, 0.82, 0.96) * faint;
    col += tint * bright;

    gl_FragColor = vec4(col, 1.0);
  }`;

function starSprite() {
  const n = 64, cv = document.createElement('canvas'); cv.width = cv.height = n;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(n/2,n/2,0,n/2,n/2,n/2);
  grd.addColorStop(0,   'rgba(255,255,255,1)');
  grd.addColorStop(.18, 'rgba(255,255,255,.85)');
  grd.addColorStop(.42, 'rgba(190,210,255,.22)');
  grd.addColorStop(1,   'rgba(160,190,255,0)');
  g.fillStyle = grd; g.fillRect(0,0,n,n);
  return new THREE.CanvasTexture(cv);
}

function makeStars(count = 900, radius = 380) {
  const pos = new Float32Array(count*3), col = new Float32Array(count*3);
  const siz = new Float32Array(count);
  let seed = 0x1234567;
  const rnd = () => ((seed = (seed*1103515245 + 12345) & 0x7FFFFFFF) / 0x7FFFFFFF);
  const C = new THREE.Color();
  for (let i = 0; i < count; i++) {
    /* uniform on the sphere, slightly concentrated toward the galactic band */
    const u = rnd()*2 - 1, th = rnd()*Math.PI*2;
    const s = Math.sqrt(1 - u*u);
    const y = u * (rnd() < .55 ? .55 : 1);
    const k = Math.sqrt(Math.max(0, 1 - y*y));
    pos[i*3]   = radius * k * Math.cos(th);
    pos[i*3+1] = radius * y;
    pos[i*3+2] = radius * k * Math.sin(th);
    const mag = Math.pow(rnd(), 5);              // few bright, many faint
    siz[i] = 1.7 + mag*11;
    /* colour temperature: mostly white-blue, a minority orange */
    const t = rnd();
    if (t < .10) C.setHSL(.07, .55, .62);
    else if (t < .22) C.setHSL(.12, .35, .74);
    else if (t < .78) C.setHSL(.58, .12, .88);
    else C.setHSL(.60, .45, .82);
    const b = .45 + mag*.55;
    col[i*3] = C.r*b; col[i*3+1] = C.g*b; col[i*3+2] = C.b*b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.setAttribute('size', new THREE.BufferAttribute(siz,1));
  const m = new THREE.ShaderMaterial({
    uniforms: { map: {value: starSprite()} },
    vertexShader: `
      attribute float size; varying vec3 vC;
      void main() {
        vC = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (300.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D map; varying vec3 vC;
      void main() {
        vec4 t = texture2D(map, gl_PointCoord);
        gl_FragColor = vec4(vC * t.rgb, t.a);
      }`,
    vertexColors: true, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, fog: false,
  });
  return new THREE.Points(g, m);
}

/* ════════ ship mesh builder ════════ */
let group=null, edgeLines=null, meshSolid=null;
let compColorOn=true, edgesOn=true, texOn=true, chamferOn=true, aoOn=true, partsOn=false;
let spaceOn=false, bloomOn=false;
/* which decoration plate to use — the archive has 11 square candidates and the
   engine's choice is not recoverable, so it is exposed rather than hard-coded */
let plateVariant = 0;
function setPlate(i) {
  plateVariant = i;
  const v = PLATE_MESH.quad_all[i % PLATE_MESH.quad_all.length];
  if (currentName) buildShip(currentName, true);
  return `plate ${i}: ${v.rid} (${v.tris} tris)`;
}

/* vertex colours = compartment tint (or plain hull) x baked occlusion */
function paintColors(g) {
  const {col, colHull, ao} = g.userData;
  const base = compColorOn ? col : colHull;
  const out = new Float32Array(base.length);
  for (let i=0, v=0; i<base.length; i+=3, v++) {
    const k = aoOn ? ao[v] : 1;
    out[i] = base[i]*k; out[i+1] = base[i+1]*k; out[i+2] = base[i+2]*k;
  }
  g.setAttribute('color', new THREE.BufferAttribute(out,3));
}
let currentName=null;

function buildShip(name, keepView) {
  const view = keepView ? {th:orbit.th, ph:orbit.ph, r:orbit.r} : null;
  currentName = name;
  const ship = SHIPS[name];
  if (group) { scene.remove(group); group.traverse(o=>{o.geometry&&o.geometry.dispose(); o.material&&o.material.dispose();}); }
  group = new THREE.Group();

  /* collect world-space faces */
  const faces=[];                       // {verts:[[x,y,z]..], comp}
  for (const cb of ship.cubes) {
    const sc = rot(cb.o, SHAPE_CENTROID[cb.shape]);
    sc[0] += cb.x; sc[1] += cb.y; sc[2] += cb.z;
    for (const loop of FACES[cb.shape]) {
      const verts = loop.map(ci => {
        const p = rot(cb.o, corner(ci));
        return [p[0]+cb.x, p[1]+cb.y, p[2]+cb.z];
      });
      faces.push({verts, comp: cb.comp, shape: cb.shape, sc, cube: cb});
    }
  }
  /* cull coincident faces + tris hidden under quads */
  const keyOf = vs => vs.map(v=>v.join(',')).sort().join('|');
  const cnt = new Map();
  faces.forEach(f => { f.k = keyOf(f.verts); cnt.set(f.k, (cnt.get(f.k)||0)+1); });
  const quadVertSets = [];
  faces.forEach(f => { if (f.verts.length===4 && cnt.get(f.k)===1)
      quadVertSets.push(new Set(f.verts.map(v=>v.join(',')))); });
  const kept = faces.filter(f => {
    if (cnt.get(f.k) > 1) return false;                     // interior pair
    if (f.verts.length===3) {                               // tri under a quad?
      const vk = f.verts.map(v=>v.join(','));
      for (const qs of quadVertSets)
        if (vk.every(v=>qs.has(v))) return false;
    }
    return true;
  });

  /* ── real part meshes in place of the procedural hull ──
     Each cube shape was matched to a decoded mesh by corner set: the mesh's
     corners reproduce the engine's own vertexIndex table exactly (k7, k6 and k4
     had a single candidate each). The mesh is authored in the unit cell, so it
     rides the same rotate-about-centre transform the facets use. */
  if (partsOn && typeof SHAPE_MESH !== 'undefined') {
    const occ2 = occupancyOf(ship.cubes);
    const pos=[], col=[], nrm=[];
    const cHull = new THREE.Color(COMP[HULL_ID].c);
    let missing = 0;
    for (const cb of ship.cubes) {
      const sm = SHAPE_MESH[cb.shape];
      if (!sm) { missing++; continue; }
      const M = ORIENTATIONS[cb.o];
      const own = `${cb.x},${cb.y},${cb.z}`;
      const c = compColorOn ? new THREE.Color(COMP[cb.comp].c) : cHull;
      for (const s of sm.sub) {
        for (const i of s.idx) {
          const p = [s.pos[i*3]-.5, s.pos[i*3+1]-.5, s.pos[i*3+2]-.5];
          const w = [M[0]*p[0]+M[1]*p[1]+M[2]*p[2]+.5+cb.x,
                     M[3]*p[0]+M[4]*p[1]+M[5]*p[2]+.5+cb.y,
                     M[6]*p[0]+M[7]*p[1]+M[8]*p[2]+.5+cb.z];
          const n0 = [s.nrm[i*3], s.nrm[i*3+1], s.nrm[i*3+2]];
          const n = [M[0]*n0[0]+M[1]*n0[1]+M[2]*n0[2],
                     M[3]*n0[0]+M[4]*n0[1]+M[5]*n0[2],
                     M[6]*n0[0]+M[7]*n0[1]+M[8]*n0[2]];
          pos.push(...w); nrm.push(...n);
          const a = aoOn ? vertexAO(w, n, occ2, own) : 1;
          col.push(c.r*a, c.g*a, c.b*a);
        }
      }
    }
    /* interior module cage per cube — the machinery you see through the window.
       Cage-to-system mapping is not recoverable, so cages are handed out by
       compartment id over the family in a stable order. */
    if (typeof MODULE_MESH !== 'undefined' && MODULE_MESH.length) {
      for (const cb of ship.cubes) {
        if (cb.comp === HULL_ID) continue;              // plain hull carries none
        const mm = MODULE_MESH[cb.comp % MODULE_MESH.length];
        const M = ORIENTATIONS[cb.o];
        const own = `${cb.x},${cb.y},${cb.z}`;
        const c = compColorOn ? new THREE.Color(COMP[cb.comp].c)
                              : new THREE.Color(COMP[HULL_ID].c);
        for (const sm3 of mm.sub) for (const i of sm3.idx) {
          const p0 = [(sm3.pos[i*3]-.5)*MODULE_SCALE,
                      (sm3.pos[i*3+1]-.5)*MODULE_SCALE,
                      (sm3.pos[i*3+2]-.5)*MODULE_SCALE];
          const w = [M[0]*p0[0]+M[1]*p0[1]+M[2]*p0[2]+.5+cb.x,
                     M[3]*p0[0]+M[4]*p0[1]+M[5]*p0[2]+.5+cb.y,
                     M[6]*p0[0]+M[7]*p0[1]+M[8]*p0[2]+.5+cb.z];
          const n0 = [sm3.nrm[i*3], sm3.nrm[i*3+1], sm3.nrm[i*3+2]];
          const n = [M[0]*n0[0]+M[1]*n0[1]+M[2]*n0[2],
                     M[3]*n0[0]+M[4]*n0[1]+M[5]*n0[2],
                     M[6]*n0[0]+M[7]*n0[1]+M[8]*n0[2]];
          pos.push(...w); nrm.push(...n);
          const a3 = (aoOn ? vertexAO(w, n, occ2, own) : 1) * .78;
          col.push(c.r*a3, c.g*a3, c.b*a3);
        }
      }
    }

    /* filler: the procedural hull, offset inward, sitting behind everything */
    {
      const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
      const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
      const norm=a=>{const l=Math.hypot(...a)||1; return [a[0]/l,a[1]/l,a[2]/l];};
      for (const f of kept) {
        let n = norm(cross(norm(sub(f.verts[1],f.verts[0])), sub(f.verts[2],f.verts[0])));
        const cen = f.verts.reduce((s,v)=>[s[0]+v[0],s[1]+v[1],s[2]+v[2]],[0,0,0])
                           .map(x=>x/f.verts.length);
        n = orient(n, cen, f, occ2);
        const vs = f.verts.map(v => [v[0]-n[0]*FILL_INSET,
                                     v[1]-n[1]*FILL_INSET,
                                     v[2]-n[2]*FILL_INSET]);
        /* emit triangles wound with the outward normal, whichever way the loop
           runs, so the explicit normal is not flipped by double-sided shading */
        const w0 = cross(sub(vs[1],vs[0]), sub(vs[2],vs[0]));
        const rev = w0[0]*n[0]+w0[1]*n[1]+w0[2]*n[2] < 0;
        const base = compColorOn ? new THREE.Color(COMP[f.comp].c)
                                 : new THREE.Color(COMP[HULL_ID].c);
        for (let i=1; i<vs.length-1; i++) for (const k of (rev ? [0,i+1,i] : [0,i,i+1])) {
          pos.push(...vs[k]); nrm.push(...n);
          const a2 = (aoOn ? vertexAO(vs[k], n, occ2, null) : 1) * .55;
          col.push(base.r*a2, base.g*a2, base.b*a2);
        }
      }
    }

    /* decoration plates ride over the frame's exterior faces. Each plate mesh is
       authored on a unit face with its mounting back at z=0 and the relief
       extending to -z (the same D3D-handed convention as the winding), so it is
       mounted MIRRORED along the facet normal — back on the face plane, relief
       standing out of the hull. Mapped as-is the relief would sink into the
       window and only the flat back would show. The mirror flips handedness, so
       position z and normal z are negated and each triangle is rewound. Plates
       map through the affine frame the facet itself defines — which also means
       they inherit the facet culling for free. */
    if (typeof PLATE_MESH !== 'undefined') {
      const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
      const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
      const norm=a=>{const l=Math.hypot(...a)||1; return [a[0]/l,a[1]/l,a[2]/l];};
      for (const f of kept) {
        const pm = f.verts.length === 4
          ? (PLATE_MESH.quad_all ? PLATE_MESH.quad_all[plateVariant % PLATE_MESH.quad_all.length]
                                 : PLATE_MESH.quad)
          : PLATE_MESH.tri;
        if (!pm) continue;
        const nw = norm(cross(norm(sub(f.verts[1],f.verts[0])), sub(f.verts[2],f.verts[0])));
        const cen = f.verts.reduce((s,v)=>[s[0]+v[0],s[1]+v[1],s[2]+v[2]],[0,0,0])
                           .map(x=>x/f.verts.length);
        const n = orient(nw, cen, f, occ2);
        /* per-face plate presence, recovered from the ship files (2026-07-31):
           an axis plate's face is R(slot.o)·(0,0,−1) — third matrix column
           negated; the non-axis face (cut/slope/diagonal) is slot 6. Faces
           whose slot says no plate stay bare, as authored in 2014. */
        {
          const sl = f.cube && f.cube.slots;
          if (sl) {
            const axis = Math.abs(Math.abs(n[0])+Math.abs(n[1])+Math.abs(n[2]) - 1) < 1e-6;
            let present = false;
            if (axis) {
              for (let si = 0; si < 6 && si < sl.length; si++) {
                const m = ORIENTATIONS[sl[si].o];
                if (Math.round(-m[2]) === Math.round(n[0]) &&
                    Math.round(-m[5]) === Math.round(n[1]) &&
                    Math.round(-m[8]) === Math.round(n[2])) { present = !!sl[si].p; break; }
              }
            } else present = sl[6] ? !!sl[6].p : false;
            if (!present) continue;
          }
        }
        /* the loop may wind either way; the mirror mounting needs a right-handed
           frame, or it mirrors the plate a second time in-plane and the winding
           comes out inverted on exactly those facets. Walk the loop backwards
           when its winding normal opposes the outward one. */
        const fv = (nw[0]*n[0]+nw[1]*n[1]+nw[2]*n[2] < 0)
                 ? f.verts.slice().reverse() : f.verts;
        const v0 = fv[0], E1 = sub(fv[1], v0), E2 = sub(fv[2], v0);
        /* solve the plate's local outline onto this facet */
        const [a0,a1,a2] = pm.outline;
        /* shrink the plate about its own centre: at full size it covers the whole
           face and hides the frame it is supposed to be bolted onto */
        const oc = pm.outline.reduce((s,p)=>[s[0]+p[0], s[1]+p[1]],[0,0])
                             .map(v=>v/pm.outline.length);
        const sm2 = SHAPE_MESH[f.shape];
        const k = ((sm2 && sm2.window) || 1) * PLATE_MARGIN;
        const d1=[a1[0]-a0[0], a1[1]-a0[1]], d2=[a2[0]-a0[0], a2[1]-a0[1]];
        const det = d1[0]*d2[1] - d1[1]*d2[0];
        if (!det) continue;
        const c = compColorOn ? new THREE.Color(COMP[f.comp].c)
                              : new THREE.Color(COMP[HULL_ID].c);
        for (const s of pm.sub)
        for (let t=0; t<s.idx.length; t+=3)
        for (const i of [s.idx[t], s.idx[t+2], s.idx[t+1]]) {
          const lx = oc[0] + (s.pos[i*3]  -oc[0])*k - a0[0],
                ly = oc[1] + (s.pos[i*3+1]-oc[1])*k - a0[1],
                lz = -s.pos[i*3+2];
          const t1 = ( lx*d2[1] - ly*d2[0]) / det;
          const t2 = (-lx*d1[1] + ly*d1[0]) / det;
          const w = [v0[0]+t1*E1[0]+t2*E2[0]+lz*n[0],
                     v0[1]+t1*E1[1]+t2*E2[1]+lz*n[1],
                     v0[2]+t1*E1[2]+t2*E2[2]+lz*n[2]];
          const m1 = ( s.nrm[i*3]*d2[1] - s.nrm[i*3+1]*d2[0]) / det;
          const m2 = (-s.nrm[i*3]*d1[1] + s.nrm[i*3+1]*d1[0]) / det;
          const nz = -s.nrm[i*3+2];
          const wn = norm([m1*E1[0]+m2*E2[0]+nz*n[0],
                           m1*E1[1]+m2*E2[1]+nz*n[1],
                           m1*E1[2]+m2*E2[2]+nz*n[2]]);
          pos.push(...w); nrm.push(...wn);
          const a = aoOn ? vertexAO(w, wn, occ2, null) : 1;
          col.push(c.r*a*1.06, c.g*a*1.06, c.b*a*1.06);
        }
      }
    }

    const gp = new THREE.BufferGeometry();
    gp.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    gp.setAttribute('normal', new THREE.Float32BufferAttribute(nrm,3));
    gp.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
    meshSolid = new THREE.Mesh(gp, new THREE.MeshStandardMaterial({
      vertexColors:true, side:THREE.DoubleSide, roughness:.72, metalness:.14}));
    meshSolid.castShadow = meshSolid.receiveShadow = true;
    gp.userData = {col, colHull:col, ao:null};
    group.add(meshSolid);
    if (edgesOn) {
      edgeLines = new THREE.LineSegments(new THREE.EdgesGeometry(gp, 32),
        new THREE.LineBasicMaterial({color:0xB8CBD9, transparent:true, opacity:.18}));
      group.add(edgeLines);
    }
    buildWings(ship, occ2);
    finishShip(ship, view);
    return;
  }

  const shown = chamferOn ? chamferFaces(kept, .07) : kept;

  /* geometry: non-indexed triangles, vertex colors with per-facet tone (hull plating) */
  const pos=[], col=[], colHull=[];
  const cHull = new THREE.Color(COMP[HULL_ID].c);
  const facetTone = f => {                       // deterministic per-face jitter ±6%
    let h = 2166136261;
    for (const ch of f.k) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    return .94 + ((h >>> 8) % 1000) / 1000 * .12;
  };
  const uvs=[], ao=[];
  const occ = occupancyOf(ship.cubes);      /* hull only — attached elements never occlude */
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const norm=a=>{const l=Math.hypot(...a)||1; return [a[0]/l,a[1]/l,a[2]/l];};
  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  for (const f of shown) {
    const t = facetTone(f);
    const c = new THREE.Color(COMP[f.comp].c).multiplyScalar(t);
    const ch = cHull.clone().multiplyScalar(t);
    /* planar face UVs, normalized+centered into [0,1] */
    const e1 = norm(sub(f.verts[1], f.verts[0]));
    let   n  = norm(cross(e1, sub(f.verts[2], f.verts[0])));
    /* facet winding isn't consistently outward, so settle it against the source
       solid's centroid (probe fallback for chamfer strips) */
    const cen = f.verts.reduce((s,v)=>[s[0]+v[0],s[1]+v[1],s[2]+v[2]],[0,0,0])
                       .map(x=>x/f.verts.length);
    n = orient(n, cen, f, occ);
    const ownKey = `${Math.floor(cen[0]-.3*n[0])},${Math.floor(cen[1]-.3*n[1])},${Math.floor(cen[2]-.3*n[2])}`;
    const e2 = cross(n, e1);
    const fuv = f.verts.map(v => [dot(sub(v,f.verts[0]),e1), dot(sub(v,f.verts[0]),e2)]);
    const us = fuv.map(p=>p[0]), vs = fuv.map(p=>p[1]);
    const u0 = Math.min(...us), v0 = Math.min(...vs);
    const s = Math.max(Math.max(...us)-u0, Math.max(...vs)-v0) || 1;
    const mu = (1-(Math.max(...us)-u0)/s)/2, mv = (1-(Math.max(...vs)-v0)/s)/2;
    const nv = f.verts.length;
    const idx = [];
    for (let i=1; i<nv-1; i++) idx.push(0, i, i+1);  // fan: works for tri/quad/n-gon
    for (const i of idx) {
      pos.push(...f.verts[i]);
      col.push(c.r,c.g,c.b);
      colHull.push(ch.r,ch.g,ch.b);
      ao.push(vertexAO(f.verts[i], n, occ, ownKey));
      uvs.push(...(f.plain ? BLANK_UV
                 : atlasUV(f.comp, (fuv[i][0]-u0)/s+mu, (fuv[i][1]-v0)/s+mv)));
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
  g.userData = {col, colHull, ao};
  paintColors(g);
  g.computeVertexNormals();
  meshSolid = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    vertexColors:true, side:THREE.DoubleSide, flatShading:true,
    roughness:.8, metalness:.08, map: texOn ? ATLAS : null}));
  meshSolid.castShadow = meshSolid.receiveShadow = true;
  group.add(meshSolid);

  /* accent lines trace the facet outlines — when chamfered, the bevel strips are
     excluded so each plate gets one crisp contour instead of a double line */
  const eSrc = chamferOn ? shown.filter(f=>!f.plain) : shown;
  const ePos = [];
  for (const f of eSrc)
    for (let i=1; i<f.verts.length-1; i++)
      ePos.push(...f.verts[0], ...f.verts[i], ...f.verts[i+1]);
  const gE = new THREE.BufferGeometry();
  gE.setAttribute('position', new THREE.Float32BufferAttribute(ePos,3));
  edgeLines = new THREE.LineSegments(
    new THREE.EdgesGeometry(gE, 25),
    new THREE.LineBasicMaterial({color:0xB8CBD9, transparent:true,
                                 opacity: chamferOn ? .3 : .4}));
  edgeLines.visible = edgesOn;
  group.add(edgeLines);

  buildWings(ship, occ);
  finishShip(ship, view);
}

/* wings — exact geometry: a flat polygon spanning cube corners, per the engine's
   own tables. Zero thickness is faithful to the data; the plate mesh the engine
   skinned onto it lives in the part catalogue but can't be tied to a type. */
function buildWings(ship, occ) {
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const norm=a=>{const l=Math.hypot(...a)||1; return [a[0]/l,a[1]/l,a[2]/l];};
  if (ship.elements.length) {
    const wp = [], wc = [];
    const cw = new THREE.Color(WING_COLOR);
    for (const el of ship.elements) {
      const ring = WING_RING[el.kind];
      if (!ring) continue;
      const vs = ring.map(ci => {
        const p = rot(el.o, corner(ci));
        return [p[0]+el.x, p[1]+el.y, p[2]+el.z];
      });
      const nrm = norm(cross(norm(sub(vs[1],vs[0])), sub(vs[2],vs[0])));
      const flip = [-nrm[0],-nrm[1],-nrm[2]];
      /* a wing is open on both sides, so occlude it symmetrically */
      const wao = vs.map(v => (vertexAO(v, nrm, occ, null) +
                              vertexAO(v, flip, occ, null)) / 2);
      for (let i=1; i<vs.length-1; i++)
        for (const k of [0, i, i+1]) {
          wp.push(...vs[k]);
          const a = aoOn ? wao[k] : 1;
          wc.push(cw.r*a, cw.g*a, cw.b*a);
        }
    }
    if (wp.length) {
      const gw = new THREE.BufferGeometry();
      gw.setAttribute('position', new THREE.Float32BufferAttribute(wp,3));
      gw.setAttribute('color', new THREE.Float32BufferAttribute(wc,3));
      gw.computeVertexNormals();
      const wing = new THREE.Mesh(gw, new THREE.MeshStandardMaterial({
        vertexColors:true, side:THREE.DoubleSide, flatShading:true,
        roughness:.85, metalness:.06}));
      wing.castShadow = wing.receiveShadow = true;
      group.add(wing);
      group.add(new THREE.LineSegments(new THREE.EdgesGeometry(gw, 20),
        new THREE.LineBasicMaterial({color:0xB8CBD9, transparent:true, opacity:.35})));
    }
  }
}

/* center, fit the camera and the shadow frustum, refresh the title block */
function finishShip(ship, view) {
  const bb = new THREE.Box3().setFromObject(group);
  const c = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
  group.position.sub(c);
  grid.position.y = -(sz.y/2)-1.2;
  floor.position.y = grid.position.y - .03;
  scene.add(group);
  /* fit key light + shadow frustum to this ship */
  const rad = sz.length()/2 + 2;
  key.position.set(rad*.7, rad*1.15, rad*.45);
  key.target.position.set(0,0,0);
  const sc = key.shadow.camera;
  sc.left = sc.bottom = -rad; sc.right = sc.top = rad;
  sc.near = .1; sc.far = rad*3.2;
  sc.updateProjectionMatrix();
  orbit.tgt.set(0,0,0);
  orbit.r = Math.max(sz.length()*1.35, 8);
  if (view) Object.assign(orbit, view);
  stamp(ship, sz);
}

/* ════════ title block ════════ */
function stamp(ship, sz) {
  const hist = {};
  ship.cubes.forEach(c=>hist[c.comp]=(hist[c.comp]||0)+1);
  const max = Math.max(...Object.values(hist));
  const rows = Object.keys(COMP).filter(k=>hist[k]).sort((a,b)=>a-b).map(k=>{
    const col = '#'+COMP[k].c.toString(16).padStart(6,'0');
    return `<div class="crow"><span class="sw" style="background:${col}"></span>` +
      `<span class="cn">${COMP[k].n}</span>` +
      `<span class="bar"><i style="background:${col};width:${100*hist[k]/max}%"></i></span>` +
      `<span class="ct">${hist[k]}</span></div>`;
  }).join('');
  const wh = {};
  ship.elements.forEach(e => wh[e.kind] = (wh[e.kind]||0) + 1);
  const el = ship.elements.length
    ? '· крылья ' + Object.keys(wh).sort().map(k=>`${WING_NAMES[k]}×${wh[k]}`).join(' ') : '';
  document.getElementById('stamp').innerHTML =
   `<div class="row"><div class="cell grow"><span class="lab">корабль</span><div class="big">${ship.display}</div></div>
     <div class="cell"><span class="lab">борт №</span><div class="num">${ship.name.split('-')[0].toUpperCase()}</div></div></div>
    <div class="row"><div class="cell grow"><span class="lab">класс</span>${ship.class}</div>
     <div class="cell grow"><span class="lab">принадлежность</span>${ship.nation}</div>
     <div class="cell"><span class="lab">ранг</span>${ship.rank}</div></div>
    <div class="row"><div class="cell grow"><span class="lab">габариты (клетки)</span>${Math.round(sz.x)} × ${Math.round(sz.y)} × ${Math.round(sz.z)}</div>
     <div class="cell grow"><span class="lab">структура</span>${ship.cubes.length} блоков ${el}</div></div>
    <div id="comp">${rows}</div>`;
}

/* ════════ registry rail ════════ */
const RANKS = ['I','I+','II','III','IV','V','VI','-','?'];
const nav = document.getElementById('registry');
const byRank = {};
Object.values(SHIPS).forEach(s => (byRank[s.rank] ||= []).push(s));
for (const r of RANKS) {
  if (!byRank[r]) continue;
  const h = document.createElement('div'); h.className='rank';
  h.textContent = r==='-' ? 'гражданские' : (r==='?' ? 'без реестра' : 'ранг '+r);
  nav.appendChild(h);
  byRank[r].sort((a,b)=>a.name.localeCompare(b.name)).forEach(s=>{
    const b = document.createElement('button'); b.className='ship'; b.dataset.name=s.name;
    b.innerHTML = `<span class="hull">${s.name.split('-')[0].toUpperCase()}</span>` +
                  `<span class="nm">${s.display}</span><span class="cls">${s.class}</span>`;
    b.onclick = () => { select(s.name); };
    nav.appendChild(b);
  });
}
function select(name) {
  nav.querySelectorAll('.ship').forEach(x=>x.classList.toggle('sel', x.dataset.name===name));
  buildShip(name);
}

/* ════════ toggles ════════ */
const btn = (id, fn) => { const b=document.getElementById(id);
  b.onclick=()=>{ const on = b.getAttribute('aria-pressed')!=='true';
    b.setAttribute('aria-pressed', on); fn(on); }; };
btn('btnRot',  on => orbit.auto = on);
btn('btnEdge', on => { edgesOn=on; if(edgeLines) edgeLines.visible=on; });
/* in parts mode the tint and occlusion are baked per vertex at build time,
   so those toggles rebuild rather than repaint */
btn('btnComp', on => { compColorOn=on; recolor(); });
btn('btnAO',   on => { aoOn=on;        recolor(); });
function recolor() {
  if (partsOn) { if (currentName) buildShip(currentName, true); }
  else if (meshSolid) paintColors(meshSolid.geometry);
}
btn('btnTex', on => { texOn=on;
  if (meshSolid) { meshSolid.material.map = on ? ATLAS : null;
    meshSolid.material.needsUpdate = true; } });
btn('btnCham', on => { chamferOn=on; if (currentName) buildShip(currentName, true); });
document.getElementById('btnPlate').onclick = () => {
  const n = PLATE_MESH.quad_all ? PLATE_MESH.quad_all.length : 1;
  const v = setPlate((plateVariant + 1) % n);
  document.getElementById('btnPlate').textContent = 'plate ' + (plateVariant+1) + '/' + n;
};
btn('btnSpace', on => { spaceOn=on; setSpace(on); });
btn('btnBloom', on => { bloomOn=on; if (on) initBloom(); });
btn('btnParts', on => { partsOn=on;
  for (const id of ['btnTex','btnCham']) document.getElementById(id).disabled = on;
  if (currentName) buildShip(currentName, true); });

/* ════════ loop ════════ */
/* ════════ bloom ════════
   Selective by threshold rather than by layer: the hull sits well below it, so
   only star cores and the brightest lit facets bleed. */
let composer = null, bloomPass = null;
function initBloom() {
  if (composer) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(w, h), .55, .62, .93);
  composer.addPass(bloomPass);
  composer.setSize(w, h);
}
function resize() {
  const w=stage.clientWidth, h=stage.clientHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  if (composer) composer.setSize(w,h);
}
addEventListener('resize', resize); resize();
(function tick(){
  requestAnimationFrame(tick);
  if (orbit.auto && !drag) orbit.th += .0022;
  orbit.th += orbit.vth; orbit.ph += orbit.vph;
  orbit.vth*=.88; orbit.vph*=.88;
  orbit.ph = Math.max(.08, Math.min(Math.PI-.08, orbit.ph));
  camera.position.set(
    orbit.tgt.x + orbit.r*Math.sin(orbit.ph)*Math.sin(orbit.th),
    orbit.tgt.y + orbit.r*Math.cos(orbit.ph),
    orbit.tgt.z + orbit.r*Math.sin(orbit.ph)*Math.cos(orbit.th));
  camera.lookAt(orbit.tgt);
  if (bloomOn && composer) composer.render(); else renderer.render(scene, camera);
})();

select('m12-centurion');
</script>
